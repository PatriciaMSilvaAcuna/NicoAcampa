<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Compradores para Sorteo -</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f2f2f2;padding:8px}
.container{max-width:430px;margin:0 auto;background:white;border-radius:12px;padding:10px}
h1{text-align:center;font-size:20px;margin:5px 0}
p{text-align:center;font-size:13px;color:#444}
.premio-container{text-align:center;border:1px solid #eee;border-radius:10px;padding:6px;margin:6px 0;background:#fffbe6}
.premio-container p{margin:2px;font-weight:bold}
.premio-container img{width:90px;border-radius:8px}
#estadisticas{text-align:center;background:#e8f5e9;padding:8px;border-radius:8px;font-weight:bold;font-size:13px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.numero{height:48px;border:2px solid #ddd;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;line-height:1.15;padding:2px;overflow:hidden}
.numero .linea{font-size:13px;font-weight:900;line-height:1;display:flex;gap:2px;align-items:center}
.numero .nom{font-size:10px;font-weight:700;line-height:1.1;word-break:break-word;text-align:center;width:100%;display:block}
.numero.libre{background:#fff}
.numero.reservado{background:#FFEB3B;border-color:#F9A825}
.numero.pagado{background:#4CAF50;color:white;border-color:#2E7D32}
.botones{display:flex;gap:6px;margin-top:10px}
button{flex:1;padding:10px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-foto{background:#25D366;color:white}
.btn-borrar{background:#eee}
.modo-foto .botones,.modo-foto .leyenda,.modo-foto .hint{display:none}
footer{text-align:center;font-size:11px;color:#888;margin-top:10px}
/* En celu, que no se achique más */
@media (max-width:480px){
  .container{padding:6px}
  .grid{gap:2px}
  .numero{height:52px}
  .numero .linea{font-size:12px}
  .numero .nom{font-size:9.5px}
}
</style>
</head>
<body>
<div class="container">
<h1>Registro de Compradores</h1>
<p>Se sorteará una vez vendido la totalidad de los números por Lotería Nacional</p>
<div class="premio-container"><p>1º PREMIO</p><p>Juego de Sábana de 2 1/2 PL</p>
<div id="estadisticas"></div>
<div class="leyenda" style="font-size:11px;text-align:center">⬜ Libre &nbsp; 🟨 Reservado &nbsp; ✅ Pagado</div>
<div class="grid" id="gridNumeros"></div>
<div class="botones">
<button class="btn-foto" onclick="modoFoto()">📸 Modo Foto para Estado</button>
<button class="btn-borrar" onclick="limpiar()">Borrar todo</button>
</div>
<p class="hint" style="font-size:11px;color:#888">1 toque: nombre + si pagó. Queda guardado solo.</p>
<footer>© 2024 PMS</footer>
</div>
<script>
let datos = JSON.parse(localStorage.getItem('nicoAcampa_v3')||'{}');
const grid = document.getElementById('gridNumeros');
function nombreCorto(n){ return n.trim().split(' ')[0].slice(0,9); }
function dibujar(){
  grid.innerHTML='';
  let libres=0, reservados=0, pagados=0;
  for(let i=0;i<=99;i++){
    let n=String(i).padStart(2,'0');
    let info=datos[n];
    let estado = info ? info.estado : 'libre';
    let div=document.createElement('div');
    div.className='numero '+estado;
    if(!info){
      div.innerHTML='<span class="linea">'+n+'</span><span class="nom">&nbsp;</span>';
    } else if(estado==='pagado'){
      div.innerHTML='<span class="linea">'+n+' ✓</span><span class="nom">'+nombreCorto(info.nombre)+'</span>';
    } else {
      div.innerHTML='<span class="linea">'+n+'</span><span class="nom">'+nombreCorto(info.nombre)+'</span>';
    }
    div.onclick=()=>{
      if(!datos[n]){
        let nombre=prompt('Número '+n+'\n¿Quién lo compra?');
        if(!nombre) return;
        let pago = confirm('¿'+nombre+' YA PAGÓ el '+n+'?\nAceptar = Pagado ✅\nCancelar = Reservado 🟨');
        datos[n]={nombre: nombre.trim(), estado: pago ? 'pagado' : 'reservado'};
      } else if(datos[n].estado==='reservado'){
        if(confirm('¿'+datos[n].nombre+' ya PAGÓ el '+n+'?')) datos[n].estado='pagado';
        else if(confirm('¿Querés LIBERAR el '+n+'?')) delete datos[n];
      } else {
        if(confirm('Número '+n+' - '+datos[n].nombre+' - Pagado ✅\n¿Querés LIBERARLO?')) delete datos[n];
      }
      localStorage.setItem('nicoAcampa_v3', JSON.stringify(datos));
      dibujar();
    };
    grid.appendChild(div);
    if(!info) libres++; else if(estado==='reservado') reservados++; else pagados++;
  }
  document.getElementById('estadisticas').textContent='Libres: '+libres+' | Reservados: '+reservados+' | Pagados ✓: '+pagados+' | Total: 100';
}
function limpiar(){ if(confirm('¿Borrar todos?')){ datos={}; localStorage.removeItem('nicoAcampa_v3'); dibujar(); } }
function modoFoto(){ document.body.classList.add('modo-foto'); alert('Sacá el screenshot ahora. Tocá cualquier lado para volver.'); document.body.onclick=()=>document.body.classList.remove('modo-foto'); }
dibujar();
</script>
</body>
</html>
